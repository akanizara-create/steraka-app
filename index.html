<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#04071f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Steraka — keep yourself in check</title>
<link rel="preload" href="fonts/urbanist-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="device">
  <div id="app">
    <div id="view"></div>
    <nav id="dock" hidden>
      <a href="#/home" data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg></a>
      <a href="#/streaks" data-tab="streaks" aria-label="My streaks"><svg viewBox="0 0 24 24"><path d="M12 2.5c.6 3.2 4.9 5.6 4.9 10.6A4.9 4.9 0 0 1 12 18a4.9 4.9 0 0 1-4.9-4.9c0-2.1 1-3.5 2.1-4.6.2 1.6.9 2.6 1.9 3.1-.4-3.1.1-6.6.9-9.1z"/><path d="M6 21h12"/></svg></a>
      <button id="dockAdd" aria-label="New streak"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <a href="#/partners" data-tab="partners" aria-label="Partners"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.4c2.6.2 4.2 1.9 4.6 4.6"/></svg><i class="dot" id="dockBadge" hidden></i></a>
      <a href="#/profile" data-tab="profile" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/></svg></a>
    </nav>
    <div id="sheetRoot"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
